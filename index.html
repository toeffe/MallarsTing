<!DOCTYPE html>
<html lang="da" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Inspectra" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Inspectra – Kontrol</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='22' text-anchor='middle' fill='%23fff' font-size='18' font-family='sans-serif'%3EI%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="src/icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="update-banner" class="update-banner hidden">
    <span>Ny version klar</span>
    <button type="button" id="btn-update-reload" class="btn primary small">Genindlæs</button>
    <button type="button" id="btn-update-dismiss" class="btn ghost icon" title="Luk">×</button>
  </div>

  <div id="app">

    <section id="view-login" class="view active">
      <div class="login-card">
        <div class="logo">
          <div class="logo-mark">I</div>
          <h1>Inspectra</h1>
        </div>
        <form id="login-form">
          <label for="user-id">Arbejds-ID</label>
          <input id="user-id" type="text" placeholder="Indtast dit arbejds-ID" autocomplete="username" required />
          <p class="hint"></p>
          <button type="submit" class="btn primary full">Log ind</button>
        </form>
        <button type="button" id="btn-theme-login" class="btn ghost full theme-toggle" style="margin-top:12px">
          Skift tema
        </button>
      </div>
    </section>

    <section id="view-dashboard" class="view">
      <header class="topbar">
        <div>
          <h2>Kontroller</h2>
          <p class="sub" id="user-label"></p>
        </div>
        <div class="topbar-actions">
          <label class="btn ghost icon file-btn" title="Importér .inspectra">
            ⇧
            <input id="import-file" type="file" accept=".inspectra,application/json" />
          </label>
          <button type="button" id="btn-history" class="btn ghost icon" title="Historik">▤</button>
          <button type="button" id="btn-theme" class="btn ghost icon theme-toggle" title="Skift tema">◐</button>
          <button type="button" id="btn-version-info" class="btn ghost icon" title="Version">ⓘ</button>
          <button type="button" id="btn-logout" class="btn ghost icon" title="Log ud">⎋</button>
        </div>
      </header>
      <div id="category-bar" class="category-bar" role="tablist" aria-label="Kategori"></div>
      <div id="rengoring-map" class="map-panel hidden">
        <img src="src/kort.png" alt="Plantegning – rengøringszoner" />
        <p class="map-caption"></p>
      </div>
      <div class="schedule-bar">
        <span class="badge">Interval</span>
        <select id="schedule-filter">
          <option value="all">Alle kontroller</option>
          <option value="daily">Daglig</option>
          <option value="weekly">Ugentlig</option>
          <option value="monthly">Månedlig</option>
          <option value="yearly">Årlig</option>
        </select>
      </div>
      <div id="route-list" class="route-list"></div>
    </section>

    <section id="view-route" class="view">
      <header class="topbar sticky">
        <button type="button" id="btn-back-routes" class="btn ghost icon">←</button>
        <div class="flex-1">
          <h2 id="route-title">Kontrol</h2>
          <p class="sub" id="route-progress">0 / 0 grupper</p>
        </div>
        <button type="button" id="btn-finish-route" class="btn primary small" disabled>Afslut</button>
      </header>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div id="machine-steps" class="machine-steps"></div>
    </section>

    <section id="view-machine" class="view">
      <header class="topbar sticky">
        <button type="button" id="btn-back-machines" class="btn ghost icon">←</button>
        <div class="flex-1">
          <h2 id="machine-title">Gruppe</h2>
          <p class="sub" id="machine-location"></p>
        </div>
      </header>
      <div id="view-toggle" class="view-toggle hidden"></div>
      <div id="machine-guide" class="machine-guide hidden"></div>
      <div id="check-items" class="check-items"></div>
      <div id="machine-bottom-bar" class="bottom-bar hidden">
        <div id="point-nav" class="point-nav">
          <button type="button" id="btn-prev-point" class="btn ghost">Forrige</button>
          <span id="point-nav-label" class="point-nav-label"></span>
          <button type="button" id="btn-next-point" class="btn primary">Næste</button>
        </div>
      </div>
    </section>

    <section id="view-finish" class="view">
      <header class="topbar">
        <h2>Kontrol afsluttet</h2>
      </header>
      <div class="summary-card" id="summary-card"></div>
      <div class="bottom-bar stacked">
        <button type="button" id="btn-download-pdf" class="btn primary full">Download PDF-rapport</button>
        <button type="button" id="btn-mailto" class="btn secondary full">Send via e-mail</button>
        <button type="button" id="btn-share" class="btn secondary full hidden">Del PDF</button>
        <button type="button" id="btn-new-route" class="btn ghost full">Tilbage</button>
      </div>
    </section>

    <section id="view-history" class="view">
      <header class="topbar sticky">
        <button type="button" id="btn-back-history" class="btn ghost icon">←</button>
        <div class="flex-1">
          <h2>Historik</h2>
        </div>
      </header>
      <div id="history-list" class="history-list"></div>
    </section>

    <section id="view-history-detail" class="view">
      <header class="topbar sticky">
        <button type="button" id="btn-back-history-detail" class="btn ghost icon">←</button>
        <div class="flex-1">
          <h2>Gennemført kontrol</h2>
        </div>
        <button type="button" id="btn-history-pdf" class="btn primary small">PDF</button>
      </header>
      <div id="history-detail-body"></div>
    </section>

  </div>

  <div id="import-modal" class="modal hidden">
    <div class="modal-content" id="import-modal-body"></div>
  </div>

  <div id="version-modal" class="modal hidden">
    <div class="modal-content" id="version-modal-body"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
